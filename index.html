<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ramanandar</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #020914;
      --surface: rgba(10, 25, 55, 0.65);
      --surface-hover: rgba(15, 40, 85, 0.85);
      --blue-glow: #1a6fff;
      --blue-bright: #4da3ff;
      --blue-soft: #a8cfff;
      --accent: #00d4ff;
      --text: #e8f4ff;
      --muted: #7aaccc;
      --border: rgba(77, 163, 255, 0.2);
      --border-hover: rgba(77, 163, 255, 0.55);
    }

    html, body {
      height: 100%;
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(26,111,255,0.22) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(0,212,255,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 10% 70%, rgba(26,111,255,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 60px 20px 50px;
    }

    .avatar-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 24px;
      animation: fadeDown 0.7s ease both;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0b2a6b 0%, #0a1a40 50%, #061030 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 48px;
      font-weight: 900;
      color: var(--blue-bright);
      letter-spacing: -1px;
      border: 2px solid rgba(77, 163, 255, 0.5);
      box-shadow: 0 0 16px rgba(77,163,255,0.4), 0 0 40px rgba(26,111,255,0.15);
      animation: glowPulse 3s ease-in-out infinite;
    }

    .name {
      font-family: 'Cinzel', serif;
      font-size: clamp(22px, 6vw, 34px);
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--blue-soft) 0%, var(--accent) 50%, var(--blue-bright) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeDown 0.8s 0.1s ease both;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 400;
      animation: fadeDown 0.8s 0.2s ease both;
      margin-bottom: 10px;
    }

    .divider {
      width: 50px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--blue-glow), var(--accent), var(--blue-glow), transparent);
      margin: 14px auto 36px;
      animation: fadeDown 0.8s 0.25s ease both;
    }

    .links {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.7s ease both;
    }

    .link-card:nth-child(1) { animation-delay: 0.3s; }
    .link-card:nth-child(2) { animation-delay: 0.4s; }
    .link-card:nth-child(3) { animation-delay: 0.5s; }
    .link-card:nth-child(4) { animation-delay: 0.6s; }
    .link-card:nth-child(5) { animation-delay: 0.7s; }
    .link-card:nth-child(6) { animation-delay: 0.8s; }

    .link-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(77,163,255,0.08) 0%, rgba(0,212,255,0.05) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .link-card:hover {
      border-color: var(--border-hover);
      background: var(--surface-hover);
      transform: translateY(-3px) scale(1.015);
      box-shadow: 0 8px 32px rgba(26,111,255,0.22), 0 0 0 1px rgba(77,163,255,0.3);
    }

    .link-card:hover::before { opacity: 1; }

    .icon-box {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 22px;
    }

    .icon-bili  { background: linear-gradient(135deg, #00a1d6 0%, #00c9ff 100%); }
    .icon-yt    { background: linear-gradient(135deg, #c00 0%, #ff4444 100%); }
    .icon-ig    { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
    .icon-bstat { background: linear-gradient(135deg, #1a6fff 0%, #00d4ff 100%); }
    .icon-tt    { background: linear-gradient(135deg, #010101 0%, #2a2a2a 100%); }
    .icon-lynk  { background: linear-gradient(135deg, #f97316 0%, #fb923c 100%); }

    .link-info { flex: 1; min-width: 0; }

    .link-name {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.3px;
      color: var(--text);
    }

    .link-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrow {
      color: var(--blue-bright);
      font-size: 16px;
      opacity: 0.6;
      transition: transform 0.3s ease, opacity 0.3s ease;
      flex-shrink: 0;
    }
    .link-card:hover .arrow { transform: translateX(4px); opacity: 1; }

    footer {
      margin-top: 48px;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(122,172,204,0.4);
      text-transform: uppercase;
      animation: fadeUp 0.7s 0.8s ease both;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 16px rgba(77,163,255,0.4), 0 0 40px rgba(26,111,255,0.15); }
      50%       { box-shadow: 0 0 28px rgba(77,163,255,0.7), 0 0 60px rgba(26,111,255,0.3); }
    }

    svg { display: block; }
  </style>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let W, H, stars = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function initStars(n) {
      n = n || 120;
      stars = [];
      for (var i = 0; i < n; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.2 + 0.2,
          a: Math.random(),
          da: (Math.random() - 0.5) * 0.005,
          hue: Math.random() > 0.7 ? 195 : 220,
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        s.a = Math.max(0.05, Math.min(1, s.a + s.da));
        if (s.a <= 0.05 || s.a >= 1) s.da *= -1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'hsla(' + s.hue + ', 80%, 75%, ' + s.a + ')';
        ctx.fill();
      }
      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', function() { resize(); initStars(); });
    resize(); initStars(); drawStars();
  </script>
